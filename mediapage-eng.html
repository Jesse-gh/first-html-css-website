<!DOCTYPE html> 
<html lang="en"> 

<head>
    <title>Media Page (ENG)</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <!-- Favicon link pointing to the media folder -->
    <link rel="icon" type="image/png" href="media/favicon.png">
</head> 

<body> 
    <div class="flex-container">
        
        <header class="header">
            <h1>HTML & CSS Website by Jesse H</h1>
        </header>

        <!-- Navigation structured for flexbox layout -->
        <nav class="navigation">
            <div class="nav-links">
                <a href="homepage-eng.html">Home</a> | 
                <a href="hp-detailed-eng.html">Technical Details</a> |

            <!-- Language Switch Button -->
            <a href="mediapage-fin.html" class="lang-btn">Kieli suomeksi</a>
        </nav>

        <main class="main-content">
            <h2>Media page</h2>
            <p>This page showcases an image gallery built with an iframe and an embedded YouTube video.</p>
            
            <h3>Image Gallery</h3>
            <!-- Image gallery using iframe (16:9 aspect ratio, 800x450). Default image loaded from the media folder -->
            <iframe width="800" height="450" name="myframe" frameborder="0" src="media/1.jpg"> 
            </iframe>
            
            <!-- Image links with thumbnails pointing to the media folder -->
            <div class="gallery-thumbnails">
                <a href="media/1.jpg" target="myframe"><img src="media/thumb1.jpg" alt="Thumbnail 1"></a>
                <a href="media/2.jpg" target="myframe"><img src="media/thumb2.jpg" alt="Thumbnail 2"></a>
                <a href="media/3.jpg" target="myframe"><img src="media/thumb3.jpg" alt="Thumbnail 3"></a>
                <a href="media/4.jpg" target="myframe"><img src="media/thumb4.jpg" alt="Thumbnail 4"></a>
                <a href="media/5.jpg" target="myframe"><img src="media/thumb5.jpg" alt="Thumbnail 5"></a>
                <a href="media/6.jpg" target="myframe"><img src="media/thumb6.jpg" alt="Thumbnail 6"></a>
                <a href="media/7.jpg" target="myframe"><img src="media/thumb7.jpg" alt="Thumbnail 7"></a>
                <a href="media/8.jpg" target="myframe"><img src="media/thumb8.jpg" alt="Thumbnail 8"></a>
                <a href="media/9.jpg" target="myframe"><img src="media/thumb9.jpg" alt="Thumbnail 9"></a>
                <a href="media/10.jpg" target="myframe"><img src="media/thumb10.jpg" alt="Thumbnail 10"></a>
            </div>

            <h3>Embedded Video</h3>
            <p>Here is a video embedded from YouTube.</p>
            <!-- Embedded YouTube video -->
            <div class="video-container">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/vL8x7LcA-Y4" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

        </main>

        <!-- Footer with copyright and LinkedIn profile on a single line -->
        <footer class="footer">

        </footer>

    </div>
</body>

</html>
